name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # With a custom domain (public/CNAME present) the site lives at "/";
      # otherwise at the project path "/<repo-name>/".
      - name: Work out base path
        run: |
          if [ -f public/CNAME ]; then echo "BASE_PATH=/" >> $GITHUB_ENV
          else echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV; fi
      - run: npm run build
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
